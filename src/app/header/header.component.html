<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-danger sticky-top shadow">
  <div class="container-fluid px-4">
    <!-- Logo/Brand -->
    <a class="navbar-brand " routerLink="/">
      <i class="fas fa-hamburger me-2"></i>
      Cronos
    </a>

    <!-- Toggle button para móviles -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Menu Items -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <!-- Inicio - Visible para todos -->
        <li class="nav-item">
          <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
            <i class="fas fa-home me-1"></i>Inicio
          </a>
        </li>

        <!-- Productos - Visible para todos -->
        <li class="nav-item">
          <a class="nav-link" routerLink="/productos" routerLinkActive="active">
            <i class="fas fa-shopping-bag me-1"></i>Productos
          </a>
        </li>

        <!-- Historial Ventas - SOLO ADMIN -->
        <li class="nav-item" *ngIf="esAdmin()">
          <a class="nav-link" routerLink="/historial-ventas" routerLinkActive="active">
            <i class="fas fa-chart-line me-1"></i>Historial Ventas
          </a>
        </li>

        <!-- Menús SOLO para usuarios normales y visitantes (NO ADMIN) -->
        <ng-container *ngIf="!esAdmin()">
  
          <li class="nav-item">
            <a class="nav-link" routerLink="/conocenos" routerLinkActive="active">
              <i class="fas fa-info-circle me-1"></i>Conócenos
            </a>
          </li>
          
        </ng-container>
      </ul>

      <!-- Carrito y Usuario -->
      <ul class="navbar-nav">
        <!-- Carrito - VISIBLE PARA TODOS (incluido admin) -->
        <li class="nav-item">
          <a class="nav-link position-relative" routerLink="/carrito">
            <i class="fas fa-shopping-cart fa-lg"></i>
            <span class="badge bg-warning text-dark position-absolute top-0 start-100 translate-middle" *ngIf="cantidadCarrito > 0">
              {{ cantidadCarrito }}
            </span>
          </a>
        </li>

        <!-- Usuario Autenticado -->
        <li class="nav-item dropdown" *ngIf="estaAutenticado()">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
            <i class="fas fa-user-circle fa-lg me-1"></i>
            {{ usuarioActual?.nombres }}
            <!-- BADGE DE ADMIN -->
            <span class="badge bg-warning text-dark ms-2" *ngIf="esAdmin()">
              <i class="fas fa-crown me-1"></i>ADMIN
            </span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <!-- Enlace al perfil (solo para usuarios normales, NO admin) -->
             <li *ngIf="!esAdmin()">
              <a class="dropdown-item" routerLink="/perfil">
                <i class="fas fa-user me-2"></i>Mi Perfil
                </a>
                </li>
                <li *ngIf="!esAdmin()">
                  <hr class="dropdown-divider">
                </li>
                  <!-- Cerrar Sesión (para todos) -->
            <li>
              <a class="dropdown-item" href="#" (click)="cerrarSesion(); $event.preventDefault()">
                <i class="fas fa-sign-out-alt me-2"></i>Cerrar Sesión
              </a>
            </li>
          </ul>
        </li>

        <!-- Botones Login/Registro -->
        <li class="nav-item" *ngIf="!estaAutenticado()">
          <a class="nav-link" routerLink="/login">
            <i class="fas fa-sign-in-alt me-1"></i>Login
          </a>
        </li>
        <li class="nav-item" *ngIf="!estaAutenticado()">
          <a class="btn btn-outline-light btn-sm ms-2" routerLink="/registro">
            Registro
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>
