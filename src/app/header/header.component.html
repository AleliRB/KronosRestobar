<nav class="navbar navbar-dark bg-danger shadow sticky-top">
  <div class="container d-flex flex-column py-1">

    <!-- LÍNEA DECORATIVA SUPERIOR -->
    <div style="width: 300px; height: 2px; background-color: #ffffffaa;" class="mx-auto mb-1"></div>

    <!-- LOGO + NOMBRE (CENTRADO) -->
    <a class="navbar-brand mx-auto text-center" routerLink="/">
      <i class="fas fa-clock me-2"></i>
      <span class="fs-3 fw-bold">Cronos</span>
    </a>

    <!-- LÍNEA DECORATIVA INFERIOR -->
    <div style="width:300px; height: 2px; background-color: #ffffffaa;" class="mx-auto mt-1 mb-2"></div>

    <!-- FILA INFERIOR: MENÚ CENTRADO + CARRITO/USUARIO -->
    <div class="d-flex w-100 align-items-center justify-content-between">

      <!-- Espacio izquierdo vacío para balance -->
      <div style="min-width: 180px;"></div>

      <!-- MENÚ CENTRAL -->
      <ul class="navbar-nav d-flex flex-row gap-2 mx-auto">
        <!-- Menús para todos -->
        <li class="nav-item">
          <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">
            <i class="fas fa-home me-1"></i> Inicio
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/productos" routerLinkActive="active">
            <i class="fas fa-shopping-bag me-1"></i> Productos
          </a>
        </li>
        <li class="nav-item" *ngIf="!esAdmin()">
          <a class="nav-link" routerLink="/conocenos" routerLinkActive="active">
            <i class="fas fa-info-circle me-1"></i> Conócenos
          </a>
        </li>

        <!-- Menú SOLO para admin -->
        <li class="nav-item" *ngIf="esAdmin()">
          <a class="nav-link" routerLink="/historial-ventas" routerLinkActive="active">
            <i class="fas fa-chart-line me-1"></i> Historial Ventas
          </a>
        </li>
      </ul>

      <!-- CARRITO + USUARIO/LOGIN (DERECHA) -->
      <div class="d-flex align-items-center gap-3" style="min-width: 180px; justify-content: flex-end;">
        
        <!-- Carrito -->
        <a class="nav-link position-relative p-0" routerLink="/carrito">
          <i class="fas fa-shopping-cart fa-lg"></i>
          <span class="badge bg-warning text-dark position-absolute top-0 start-100 translate-middle" *ngIf="cantidadCarrito > 0">
            {{ cantidadCarrito }}
          </span>
        </a>

        <!-- SI ESTÁ AUTENTICADO: Dropdown Usuario -->
        <div class="dropdown" *ngIf="estaAutenticado()">
          <a class="nav-link dropdown-toggle d-flex align-items-center p-0" href="#" role="button" data-bs-toggle="dropdown">
            <i class="fas fa-user-circle fa-lg me-2"></i>
            <span>{{ usuarioActual?.nombres }}</span>
            <span class="badge bg-warning text-dark ms-2" *ngIf="esAdmin()">
              <i class="fas fa-crown me-1"></i>ADMIN
            </span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li *ngIf="!esAdmin()">
              <a class="dropdown-item" routerLink="/perfil">
                <i class="fas fa-user me-2"></i> Mi Perfil
              </a>
            </li>
            <li *ngIf="!esAdmin()">
              <hr class="dropdown-divider">
            </li>
            <li>
              <a class="dropdown-item" href="#" (click)="cerrarSesion(); $event.preventDefault()">
                <i class="fas fa-sign-out-alt me-2"></i> Cerrar Sesión
              </a>
            </li>
          </ul>
        </div>

        <!-- SI NO ESTÁ AUTENTICADO: Login + Registro -->
        <div class="d-flex align-items-center gap-2" *ngIf="!estaAutenticado()">
          <a class="nav-link p-0" routerLink="/login">
            <i class="fas fa-sign-in-alt me-1"></i> Login
          </a>
          <a class="btn btn-outline-light btn-sm px-3" routerLink="/registro">
            Registro
          </a>
        </div>

      </div>
    </div>
  </div>
</nav>
