server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Configuración para Angular routing 
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ==========================================
    # PROXY PARA API RENIEC (DNI)
    # ==========================================
    location /api/dni/ {
        proxy_pass https://apiperu.dev/api/dni/;
        proxy_set_header Host apiperu.dev;
        proxy_set_header Authorization "Bearer 47ed608cf2038e49755c8ce4a83bc8e2f456723fbf4c72eed6a0379687d1b32b";
        proxy_set_header Content-Type "application/json";
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_redirect off;
        
        # Headers CORS
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        
        # Manejo de OPTIONS para CORS
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # ==========================================
    # PROXY PARA API RUC
    # ==========================================
    location /api/ruc/ {
        proxy_pass https://apiperu.dev/api/ruc/;
        proxy_set_header Host apiperu.dev;
        proxy_set_header Authorization "Bearer 47ed608cf2038e49755c8ce4a83bc8e2f456723fbf4c72eed6a0379687d1b32b";
        proxy_set_header Content-Type "application/json";
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_redirect off;
        
        # Headers CORS
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        
        # Manejo de OPTIONS para CORS
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # ==========================================
    # PROXY PARA API TIPO DE CAMBIO
    # ==========================================
    location /api/tipo-de-cambio {
        proxy_pass https://apiperu.dev/api/tipo-de-cambio;
        proxy_set_header Host apiperu.dev;
        proxy_set_header Authorization "Bearer 47ed608cf2038e49755c8ce4a83bc8e2f456723fbf4c72eed6a0379687d1b32b";
        proxy_set_header Content-Type "application/json";
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_redirect off;
        proxy_method POST;
        
        # Headers CORS
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        
        # Manejo de OPTIONS para CORS
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # ==========================================
    # CACHE PARA ASSETS ESTÁTICOS
    # ==========================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ==========================================
    # HEADERS DE SEGURIDAD
    # ==========================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ==========================================
    # COMPRESIÓN GZIP
    # ==========================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        text/javascript 
        application/javascript 
        application/xml+rss 
        application/json
        application/xml
        image/svg+xml;
    
    # Deshabilitar gzip para IE6
    gzip_disable "msie6";

    # ==========================================
    # CONFIGURACIÓN DE ERRORES
    # ==========================================
    error_page 404 /index.html;
}